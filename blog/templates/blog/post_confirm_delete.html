{% extends "blog/base.html" %} {% block title %}Delete Post - Blog{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h2 class="card-title">Delete Post</h2>
    <form method="post">
      {% csrf_token %}
      <p>Are you sure you want to delete "{{ object.title }}"?</p>
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'post-detail' object.pk %}" class="btn btn-secondary"
        >Cancel</a
      >
    </form>
  </div>
</div>
{% endblock %}
